services:
  ci-local:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
      - ci-local-node-modules:/app/node_modules
      - ci-local-next-cache:/app/.next
    command:
      [
        "sh",
        "-lc",
        "npm config set fetch-retries 5 && npm config set fetch-retry-maxtimeout 120000 && npm config set fetch-timeout 300000 && npm ci --no-audit --no-fund && npm run lint && npm run typecheck && npm run test && npm run build"
      ]
    environment:
      - BFF_BASE_URL=http://host.docker.internal:8100
      - LOTUS_ENVIRONMENT=test
      - WORKBENCH_IDEA_AUTH_MODE=development_configured

volumes:
  ci-local-node-modules:
  ci-local-next-cache:
