services:
  ci-local:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
      - ci-local-node-modules:/app/node_modules
      - ci-local-next-cache:/app/.next
    command:
      [
        "sh",
        "-lc",
        "npm ci && npm run lint && npm run typecheck && npm run test && npm run build"
      ]
    environment:
      - BFF_BASE_URL=http://host.docker.internal:8100

volumes:
  ci-local-node-modules:
  ci-local-next-cache:
