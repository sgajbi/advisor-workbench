name: Main Releasability Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Main Releasability / Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: reviewdog/action-actionlint@v1

  quality-gate:
    name: Main Releasability / Lint Typecheck Coverage Build
    needs: [workflow-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - name: Install
        run: make install
      - name: Dependency Security Gate
        run: make security
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Coverage Gate
        run: make test-coverage
      - name: Build
        run: make build
      - name: Upload Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-releasability-coverage-report
          path: |
            coverage
          if-no-files-found: error

  e2e-smoke:
    name: Main Releasability / Playwright Smoke
    needs: [quality-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - name: Install
        run: make install
      - name: Install Playwright Browsers
        run: npx playwright install chromium
      - name: Run Playwright Smoke
        run: make test-e2e
      - name: Upload Playwright Artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: main-releasability-playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: warn

  docker-build:
    name: Main Releasability / Validate Docker Build
    needs: [quality-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t lotus-workbench:ci-test .

  ci-local-docker:
    name: Main Releasability / CI Local Docker Parity
    needs: [quality-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Dockerized Local CI Parity
        run: make ci-local-docker
      - name: Cleanup
        if: always()
        run: make ci-local-docker-down
