name: Pull Request Merge Gate

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-lint:
    name: PR Merge Gate / Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: reviewdog/action-actionlint@v1

  quality-gate:
    name: PR Merge Gate / Lint Typecheck Coverage Build
    needs: [workflow-lint]
    runs-on: ubuntu-latest
    env:
      WORKBENCH_DEPLOYMENT_ID: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.1"
          cache: "npm"
      - name: Install
        run: make install
      - name: Canonical Runtime Ownership Contracts
        run: make test-runtime-ownership
      - name: Dependency Security Gate
        run: make security
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Coverage Gate
        run: make test-coverage
      - name: Build
        run: make build
      - name: Upload Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage
          if-no-files-found: error

  e2e-smoke:
    name: PR Merge Gate / Playwright Smoke
    needs: [quality-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WORKBENCH_DEPLOYMENT_ID: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.1"
          cache: "npm"
      - name: Install
        run: make install
      - name: Install Playwright Browsers
        run: node node_modules/playwright/cli.js install chromium
      - name: Run Playwright Smoke
        run: make test-e2e
      - name: Upload Playwright Artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: warn

  docker-build:
    name: PR Merge Gate / Docker Build And Security
    needs: [quality-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.1"
      - name: Build image
        run: docker build --build-arg WORKBENCH_DEPLOYMENT_ID="${{ github.event.pull_request.head.sha || github.sha }}" -t lotus-workbench:ci-test .
      - name: Reject fixable high and critical image vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: lotus-workbench:ci-test
          version: v0.69.3
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Pull pinned scale-proof load balancer
        run: docker pull nginx:1.28.3-alpine3.23@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
      - name: Reject fixable high and critical load-balancer vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: nginx:1.28.3-alpine3.23@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
          version: v0.69.3
          skip-setup-trivy: true
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Two-replica replacement and capacity regression proof
        env:
          SCALE_PROOF_SKIP_BUILD: "1"
          WORKBENCH_DEPLOYMENT_ID: ${{ github.event.pull_request.head.sha || github.sha }}
          WORKBENCH_SCALE_IMAGE: lotus-workbench:ci-test
        run: node scripts/scale/run-workbench-scale-proof.mjs
      - name: Upload scale-proof evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workbench-scale-proof
          path: output/scale-proof
          if-no-files-found: warn
      - name: Generate production image SBOM
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: lotus-workbench:ci-test
          version: v0.69.3
          skip-setup-trivy: true
          format: cyclonedx
          output: workbench-image.cdx.json
          exit-code: "0"
          ignore-unfixed: false
          scanners: vuln
          vuln-type: os,library
      - name: Upload production image SBOM
        uses: actions/upload-artifact@v7
        with:
          name: workbench-production-image-sbom
          path: workbench-image.cdx.json
          if-no-files-found: error

  ci-local-docker:
    name: PR Merge Gate / CI Local Docker Parity
    needs: [quality-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Dockerized Local CI Parity
        run: make ci-local-docker
      - name: Cleanup
        if: always()
        run: make ci-local-docker-down
