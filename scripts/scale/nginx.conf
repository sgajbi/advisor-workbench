pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  access_log off;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;

  upstream workbench_replicas {
    least_conn;
    server workbench-a:3000 max_fails=1 fail_timeout=2s;
    server workbench-b:3000 max_fails=1 fail_timeout=2s;
    keepalive 32;
  }

  server {
    listen 8080;

    location / {
      proxy_pass http://workbench_replicas;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_connect_timeout 1s;
      proxy_read_timeout 20s;
      proxy_send_timeout 20s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
      add_header X-Workbench-Upstream $upstream_addr always;
    }
  }
}
